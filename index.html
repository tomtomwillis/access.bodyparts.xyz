<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Jellyfin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 300;
    }

    .subtitle {
      color: #a0a0a0;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .access-btn {
      background: linear-gradient(135deg, #00d9ff 0%, #00a8cc 100%);
      border: none;
      padding: 1.2rem 3rem;
      font-size: 1.3rem;
      color: #fff;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3);
      font-weight: 500;
    }

    .access-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 217, 255, 0.4);
    }

    .access-btn:active {
      transform: translateY(0);
    }

    .access-btn:disabled {
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
    }

    .progress {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333;
      border: 2px solid #555;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #00d9ff;
      border-color: #00d9ff;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .hint {
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jellyfin</h1>
    <p class="subtitle">Click to access the media server</p>

    <button class="access-btn" id="accessBtn">Enter</button>

    <div class="progress">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <p class="hint" id="hint">Click 3 times to continue</p>
  </div>

  <script>
    let clicks = 0;
    const btn = document.getElementById('accessBtn');
    const hint = document.getElementById('hint');
    const dots = [
      document.getElementById('dot1'),
      document.getElementById('dot2'),
      document.getElementById('dot3')
    ];

    btn.addEventListener('click', function() {
      clicks++;

      if (clicks <= 3) {
        dots[clicks - 1].classList.add('active');
      }

      if (clicks === 1) {
        hint.textContent = '2 more clicks...';
      } else if (clicks === 2) {
        hint.textContent = '1 more click...';
      } else if (clicks === 3) {
        hint.textContent = 'Redirecting...';
        btn.textContent = 'Loading...';
        btn.disabled = true;

        setTimeout(function() {
          window.location.href = 'https://watch.bodyparts.xyz:8443';
        }, 500);
      }
    });
  </script>
</body>
</html>
